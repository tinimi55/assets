                    <li>**유효기간:** 6개월</li>
                </ul>
                <a href="payment_select.html?plan=vip" class="btn primary">VIP 가입</a>
            </div>

            <div class="garage-card recommended">
                <div class="garage-header vvip">VVIP 등급</div>
                <div class="garage-price">300,000원</div>
                <ul class="garage-details">
                    <li>**충전 시간:** 20시간</li>
                    <li>**카드 이용 시:** 시간당 **15,000원**</li>
                    <li>**현금/계좌 이용 시 (보너스 2시간):** 총 22시간, 시간당 약 **13,636원**</li>
                    <li>**유효기간:** 1년</li>
                </ul>
                <a href="payment_select.html?plan=vvip" class="btn secondary">VVIP 가입</a>
            </div>

            <div class="garage-card">
                <div class="garage-header svip">SVIP 등급</div>
                <div class="garage-price">500,000원</div>
                <ul class="garage-details">
                    <li>**충전 시간:** 40시간</li>
                    <li>**카드 이용 시:** 시간당 **12,500원**</li>
                    <li>**현금/계좌 이용 시 (보너스 3시간):** 총 43시간, 시간당 약 **11,628원**</li>
                    <li>**유효기간:** 1년</li>
                </ul>
                <a href="payment_select.html?plan=svip" class="btn primary">SVIP 가입</a>
            </div>
        </div>

        <p class="notice">
            **📌 유의사항:** 개러지를 1회라도 이용한 경우, 잔여시간 환불은 불가합니다.<br>
            현금/계좌 결제 시 보너스 시간이 추가 적립되며, 기간 이후 잔여 시간은 소멸됩니다.
        </p>
    </div>
</section>

<hr>

<section id="advantages" class="section advantages-section dark-bg">
    <div class="container">
        <h3>모토카워시의 특별함</h3>
